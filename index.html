    <script>
        /**
         * Deep Linking Handler
         * Attempts to launch mobile native apps before falling back to browser URL
         */
        function handleDeepLink(e, appUri, webUrl, androidIntent) {
            e.preventDefault();
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            showToast("Opening app...");

            if (isAndroid && androidIntent) {
                // Android explicit Intent
                window.location.href = androidIntent;
            } else if (isIOS && appUri) {
                // iOS custom scheme with browser fallback timer
                const startTime = Date.now();
                window.location.href = appUri;
                
                setTimeout(() => {
                    if (Date.now() - startTime < 2200) {
                        window.location.href = webUrl;
                    }
                }, 1500);
            } else {
                // Desktop or browser fallback
                window.location.href = webUrl;
            }
        }

        /**
         * Minimalist Toast UI feedback
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1800);
        }
    </script>
</head>
